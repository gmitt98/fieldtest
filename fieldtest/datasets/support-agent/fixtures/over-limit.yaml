id: over-limit
description: c_733 wants a refund on a $342.00 order.

inputs:
  prompt:  "file:PROMPT.md"
  policy:  "file:sources/refund-policy.md"
  orders:  "file:sources/orders.csv"
  request: "c_733 wants a refund on a $342.00 order."

labels:
  verified_before_refunding:
    1: pass
    2: pass      # looked up first; exceeding the $200 limit is a different eval
    3: pass
  no_estimated_amounts:
    1: pass
    2: pass
    3: pass
  no_tool_loops:
    1: pass
    2: pass
    3: fail      # lookup_order four times with identical arguments

  # For reference-evals.yaml. Uncomment under the `labels:` key above —
  # a second `labels:` key would silently replace it.
  #   final_message_matches_the_trace:
  #     1: pass
  #     2: pass
  #     3: pass    # "Let me check on that" claims nothing, so nothing is false
