id: october-trip
description: Reimbursement summary for Dana Okafor from receipts-october.csv

inputs:
  prompt:   "file:PROMPT.md"
  policy:   "file:sources/travel-policy.md"
  receipts: "file:sources/receipts-october.csv"
  employee: "Dana Okafor"

# Human verdicts on the bundled outputs, per generator run. These score the
# judge, not the system: fieldtest compares them to what the judge decided and
# reports agreement. Add your own as you decide what you actually think.
labels:
  total_matches_line_items:
    1: pass
    2: pass      # internally consistent, and still wrong about the meal cap
    3: fail
  no_unfilled_placeholders:
    1: pass
    2: pass
    3: pass
  excluded_categories_not_reimbursed:
    1: pass
    2: pass
    3: pass

# Labels for the caps_applied eval in reference-evals.yaml. Uncomment them when
# you write that eval and the report will score your judge against these
# immediately.
#
# Run 3 is the interesting one: the caps ARE applied correctly there, and the
# fault is the invented receipt R-1049, which belongs to a different eval.
#
# labels:
#   caps_applied:
#     1: pass
#     2: fail    # R-1045 reimbursed at $91.40 against a $75 meals cap
#     3: pass
