id: june-trip
description: Reimbursement summary for Tom Alvarez from receipts-june.csv

inputs:
  prompt:   "file:PROMPT.md"
  policy:   "file:sources/travel-policy.md"
  receipts: "file:sources/receipts-june.csv"
  employee: "Tom Alvarez"

labels:
  excluded_categories_not_reimbursed:
    1: pass
    2: fail      # R-1190, alcohol, reimbursed in full
    3: pass
  total_matches_line_items:
    1: pass
    2: pass      # adds up; it is the policy that was ignored, not the sum
    3: pass
  no_unfilled_placeholders:
    1: pass
    2: pass
    3: pass

  # For reference-evals.yaml, as above — under the `labels:` key, not a new one:
  #
  # caps_applied:
  #   1: pass
  #   2: pass    # reimbursing alcohol is a policy 4.3 exclusion, not a cap
  #   3: pass
