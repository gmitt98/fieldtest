[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldtest"
version = "0.3.0"
description = "LLM evaluation framework — define what correct, well-formed, and safe means before you measure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Galen Mittermann" }
]
keywords = [
    "eval",
    "evals",
    "evaluation",
    "llm",
    "ai",
    "llm-evaluation",
    "llm-eval",
    "ai-evaluation",
    "eval-framework",
    "llm-judge",
    "llm-testing",
    "model-evaluation",
    "guardrails",
    "ai-safety",
    "prompt-evaluation",
    "ci",
    "ci-cd",
    "regression-testing",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # 0.40.0 is the first release compatible with httpx>=0.28 (older releases
    # pass `proxies` to httpx.Client, which 0.28 removed — client construction
    # fails under default resolution).
    "anthropic>=0.40.0",
    # 6.0's sdist cannot build under Cython 3 and has no wheels for py3.12+,
    # so a lowest-version resolution fails on every modern interpreter.
    # 6.0.1 fixes the sdist build (verified building on 3.14) and ships
    # wheels through cp312.
    "pyyaml>=6.0.1",
    # pydantic-core only gains wheels for a new CPython in later releases,
    # and its sdist needs a Rust toolchain — so the workable floor rises
    # with the interpreter (2.5 → first cp312 wheels, 2.9 → cp313,
    # 2.12 → cp314; all verified against PyPI).
    "pydantic>=2.0; python_version < '3.12'",
    "pydantic>=2.5; python_version == '3.12'",
    "pydantic>=2.9; python_version == '3.13'",
    "pydantic>=2.12; python_version >= '3.14'",
    "click>=8.0",
]

[project.urls]
Homepage = "https://fieldtest.run"
Documentation = "https://fieldtest.run"
Repository = "https://github.com/gmitt98/fieldtest"
Issues = "https://github.com/gmitt98/fieldtest/issues"

[project.scripts]
fieldtest = "fieldtest.cli:main"

[project.optional-dependencies]
openai = [
    # 1.55.3, not 1.0: earlier releases pass `proxies` to httpx.Client, removed
    # in httpx 0.28. Under default resolution the client raises TypeError on
    # construction and every judge call becomes an errored row — the same break
    # the anthropic floor was raised for. Bisected: 1.55.2 fails, 1.55.3 works.
    "openai>=1.55.3",
]
gemini = [
    "google-genai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
include = [
  "fieldtest/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
  "fieldtest/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Spec 12 verification tiers. Unit and integration run by default; the live
# tier needs provider credentials and is opt-in, so a provider outage can
# never look like a contributor error.
markers = [
    "integration: real code paths, no network",
    "live: requires provider credentials; skipped without them",
]
addopts = "-m 'not live'"
