[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldtest"
version = "0.3.0"
description = "LLM evaluation framework — define what correct, well-formed, and safe means before you measure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Galen Mittermann" }
]
keywords = [
    "eval",
    "evals",
    "evaluation",
    "llm",
    "ai",
    "llm-evaluation",
    "llm-eval",
    "ai-evaluation",
    "eval-framework",
    "llm-judge",
    "llm-testing",
    "model-evaluation",
    "guardrails",
    "ai-safety",
    "prompt-evaluation",
    "ci",
    "ci-cd",
    "regression-testing",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.20.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "click>=8.0",
]

[project.urls]
Homepage = "https://fieldtest.run"
Documentation = "https://fieldtest.run"
Repository = "https://github.com/gmitt98/fieldtest"
Issues = "https://github.com/gmitt98/fieldtest/issues"

[project.scripts]
fieldtest = "fieldtest.cli:main"

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
gemini = [
    "google-genai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
include = [
  "fieldtest/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
  "fieldtest/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Spec 12 verification tiers. Unit and integration run by default; the live
# tier needs provider credentials and is opt-in, so a provider outage can
# never look like a contributor error.
markers = [
    "integration: real code paths, no network",
    "live: requires provider credentials; skipped without them",
]
addopts = "-m 'not live'"
